<!doctype html><meta charset="utf-8"><title>PA Handbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>/* layout: app window floating on a gradient ground - frosted-glass sidebar left, rounded white content panel fills the rest */
:root{color-scheme:light;--surface:#f6f3ee;--surface-raised:#ffffff;--ink:#14262b;--ink-muted:#4f6166;--line:#c9c3b8;--brand:#0f5c63;--on-brand:#ffffff;--on-brand-muted:#b9d0d2;--brand-tint:#d6e9e7;--accent:#f0763a;--sun:#f4c24a;--shell-teal-light:#1c7f86;--shell-ember:#a3471c;--space-2:8px;--space-4:16px;--space-6:24px;--space-10:40px;--radius-sm:8px;--radius-md:16px;--radius-lg:28px;--font-sans:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}html{background:var(--brand)}body{margin:0;background:var(--brand);color:var(--ink)}.pa{font-family:var(--font-sans);color:var(--ink);font-size:16px;line-height:28px}
.pa *{box-sizing:border-box}
.pa-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.pa-h3{font-size:18px;line-height:28px;font-weight:600;margin:0;color:var(--ink)}
.pa-caption{font-size:13px;line-height:20px;color:var(--ink-muted);margin:0}

/* TopicCard */
.pa-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-6)}
.pa-topic-card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);background:var(--surface-raised);border:2px solid var(--surface-raised);border-radius:var(--radius-md);text-decoration:none;color:var(--ink)}
.pa-topic-card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:var(--space-2)}
.pa-topic-card:hover{border-color:var(--brand)}
.pa-topic-card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pa-topic-card[aria-current="true"]{background:var(--brand-tint);border-color:var(--brand)}
.pa-topic-card[aria-current="true"] .pa-label{color:var(--ink)}
.pa-topic-card__state{align-self:flex-start;margin-top:var(--space-2);padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--brand);color:var(--on-brand);font-size:12px;line-height:16px;font-weight:600}

/* StepList */
.pa-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-4);counter-reset:pa-step}
.pa-steps>li{counter-increment:pa-step;display:grid;grid-template-columns:40px 1fr;gap:var(--space-4);padding:var(--space-4) var(--space-6);background:var(--surface-raised);border-radius:var(--radius-md)}
.pa-steps>li::before{content:counter(pa-step);width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:18px;display:grid;place-items:center}
.pa-steps p{margin:0;color:var(--ink-muted)}

/* Callout */
.pa-callout{padding:var(--space-6);border-radius:var(--radius-md);background:var(--brand-tint);color:var(--ink)}
.pa-callout--caution{background:var(--accent)}
.pa-callout__title{font-size:18px;line-height:28px;font-weight:600;margin:0 0 var(--space-2)}
.pa-callout p{margin:0}

/* Figure */
.pa-figure{margin:0}
.pa-figure img{display:block;width:100%;border-radius:var(--radius-lg);background:var(--brand-tint)}
.pa-figure figcaption{margin-top:var(--space-2);font-size:13px;line-height:20px;color:var(--ink-muted)}

/* App shell: gradient ground, frosted-glass sidebar flush left, white content panel fills the rest */
.pa-shell{display:grid;grid-template-columns:280px minmax(0,1fr);align-items:start;min-height:100vh;box-sizing:border-box;padding:var(--space-6);background:radial-gradient(110% 70% at 0% 0%,var(--brand) 0%,transparent 60%),radial-gradient(90% 70% at 100% 0%,var(--shell-teal-light) 0%,transparent 60%),radial-gradient(70% 55% at 0% 100%,var(--shell-ember) 0%,transparent 70%),linear-gradient(180deg,var(--brand),var(--ink));background-attachment:fixed}
.pa-side{position:sticky;top:calc(var(--space-6) + var(--space-4));height:calc(100vh - 2*var(--space-6) - 2*var(--space-4));margin-top:var(--space-4);border-radius:var(--radius-lg) 0 0 var(--radius-lg);overflow-y:auto;padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-6);color:var(--on-brand);background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.28);border-right:0}
.pa-side__brand{margin:0;padding:0 var(--space-2);font-size:20px;line-height:28px;font-weight:700;color:var(--on-brand)}
.pa-panel{min-width:0;min-height:calc(100vh - 2*var(--space-6));background:var(--surface-raised);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 0 40px rgba(20,38,43,.25)}
.pa-panel__head{display:flex;flex-wrap:wrap;gap:var(--space-4);justify-content:space-between;align-items:flex-start;padding:var(--space-6) var(--space-10) 0}
.pa-panel__head>div{display:flex;flex-direction:column;gap:var(--space-2);min-width:0;flex:1 1 320px}
.pa-panel__body{display:flex;flex-direction:column;gap:var(--space-6);padding:var(--space-6) var(--space-10) var(--space-10)}
.pa-panel__body>*{margin:0}
.pa-h1{font-size:32px;line-height:44px;font-weight:700;margin:0;color:var(--ink)}
.pa-lead{font-size:16px;line-height:28px;color:var(--ink-muted);margin:0}
.pa-btn{padding:var(--space-2) var(--space-4);border:1px solid var(--ink-muted);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:14px;line-height:22px;font-weight:600;cursor:pointer;white-space:nowrap}
.pa-btn:hover{background:var(--brand-tint)}
.pa-btn:focus-visible,.pa-tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pa-placeholder{display:grid;place-items:center;min-height:240px;border-radius:var(--radius-lg);background:var(--brand-tint);color:var(--ink);font-size:13px;line-height:20px;text-align:center;padding:var(--space-6)}

/* Tabs */
.pa-tabs{display:flex;gap:var(--space-6);padding:0 var(--space-10);border-bottom:1px solid var(--line);overflow-x:auto}
.pa-tab{padding:8px 0 10px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-muted);font:inherit;font-size:15px;line-height:24px;font-weight:600;cursor:pointer;white-space:nowrap}
.pa-tab:hover{color:var(--ink)}
.pa-tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* StepTable */
.pa-table-wrap{overflow-x:auto;margin:0 calc(-1*var(--space-10))}
.pa-table{width:100%;border-collapse:collapse;font-size:15px;line-height:24px}
.pa-table caption{text-align:left;padding:12px var(--space-10);background:var(--surface);font-weight:600;color:var(--ink)}
.pa-table caption span{margin-left:var(--space-2);padding:0 var(--space-2);border-radius:11px;background:var(--surface-raised);font-size:12px;color:var(--ink-muted)}
.pa-table th,.pa-table td{padding:14px var(--space-4);text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.pa-table th:first-child,.pa-table td:first-child{padding-left:var(--space-10);width:88px}
.pa-table th:last-child,.pa-table td:last-child{padding-right:var(--space-10)}
.pa-table thead th{font-weight:400;color:var(--ink-muted);font-size:14px}
.pa-table tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
.pa-table tbody tr:hover{background:var(--brand-tint)}
.pa-table__num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:700}

/* TopicNav: sits on the glass sidebar */
.pa-nav__title{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--on-brand);margin:0 0 var(--space-2);padding:0 var(--space-2)}
.pa-nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pa-nav__item{transition:background-color .2s ease;display:grid;grid-template-columns:1fr auto;gap:var(--space-2);align-items:start;width:100%;padding:10px 12px;border:0;border-radius:var(--radius-sm);background:none;color:var(--on-brand);font:inherit;font-size:14px;line-height:22px;text-align:left;text-decoration:none;cursor:pointer}
.pa-nav__caret{width:8px;height:8px;margin:6px 4px 0 0;border-right:2px solid var(--on-brand);border-bottom:2px solid var(--on-brand);transform:rotate(-45deg);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pa-nav__item[aria-expanded="true"] .pa-nav__caret{transform:rotate(45deg)}
.pa-nav__sub{list-style:none;margin:2px 0 var(--space-2) var(--space-4);padding:0 0 0 var(--space-2);border-left:1px solid rgba(255,255,255,.28);display:flex;flex-direction:column;gap:2px}
.pa-nav__subitem{transition:background-color .2s ease;display:block;width:100%;padding:6px 12px;border:0;border-radius:var(--radius-sm);background:none;color:var(--on-brand);font:inherit;font-size:13px;line-height:20px;text-align:left;text-decoration:none;cursor:pointer}
.pa-nav__subitem:hover{background:rgba(255,255,255,.12)}
.pa-nav__subitem:focus-visible{outline:2px solid var(--on-brand);outline-offset:2px}
.pa-nav__subitem[aria-current="true"]{background:rgba(255,255,255,.22);box-shadow:0 1px 8px rgba(20,38,43,.18);font-weight:600}
.pa-nav__item[aria-expanded="true"]{font-weight:600}
@media (prefers-reduced-motion:reduce){.pa-nav__caret{transition:none}}
.pa-nav__item:hover{background:rgba(255,255,255,.12)}
.pa-nav__item:focus-visible{outline:2px solid var(--on-brand);outline-offset:2px}
.pa-nav__item[aria-current="true"]{background:rgba(255,255,255,.22);box-shadow:0 1px 8px rgba(20,38,43,.18);font-weight:600}

@media (max-width:900px){.pa-shell{grid-template-columns:220px minmax(0,1fr);padding:var(--space-4)}.pa-side{top:calc(2*var(--space-4));height:calc(100vh - 4*var(--space-4))}.pa-panel{min-height:calc(100vh - 2*var(--space-4))}.pa-panel__head,.pa-panel__body{padding-left:var(--space-6);padding-right:var(--space-6)}.pa-tabs{padding:0 var(--space-6)}.pa-table-wrap{margin:0 calc(-1*var(--space-6))}.pa-table caption,.pa-table th:first-child,.pa-table td:first-child{padding-left:var(--space-6)}}
@media (max-width:640px){.pa-shell{grid-template-columns:minmax(0,1fr)}.pa-shell{padding:var(--space-2)}.pa-side{position:static;height:auto;margin-top:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:1px solid rgba(255,255,255,.28);border-bottom:0}.pa-panel{min-height:0}.pa-panel__head,.pa-panel__body{padding-left:var(--space-4);padding-right:var(--space-4)}.pa-tabs{padding:0 var(--space-4)}.pa-table-wrap{margin:0 calc(-1*var(--space-4))}.pa-table caption,.pa-table th:first-child,.pa-table td:first-child{padding-left:var(--space-4)}.pa-h1{font-size:24px;line-height:36px}}
/* Content blocks */
.pa-h2{font-size:22px;line-height:32px;font-weight:600;margin:0;color:var(--ink)}
.pa-num{font-variant-numeric:tabular-nums}
.pa-f-brand{fill:var(--brand)}.pa-f-ink{fill:var(--ink)}.pa-f-sun{fill:var(--sun)}.pa-f-accent{fill:var(--accent)}.pa-f-white{fill:var(--surface-raised)}.pa-f-tint{fill:var(--brand-tint)}
.pa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--space-4)}
.pa-card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface);border-radius:var(--radius-md);min-width:0}
.pa-card p{margin:0}
.pa-card svg{width:56px;height:56px;flex:none}
.pa-chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.pa-chips li{padding:2px 10px;border-radius:var(--radius-sm);background:var(--surface-raised);font-size:13px;line-height:22px;color:var(--ink)}
.pa-grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pa-tag{display:inline-block;align-self:flex-start;padding:2px 10px;border-radius:var(--radius-sm);background:var(--brand);color:var(--on-brand);font-size:12px;line-height:20px;font-weight:600}
.pa-tag--no{background:var(--accent);color:var(--ink)}
.pa-tag--plain{background:var(--surface-raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-muted)}
.pa-card>.pa-table__num{align-self:flex-start}
.pa-rate__pct.pa-rate__pct--none{color:var(--ink)}
.pa-panel__body>.pa-chips li{background:var(--surface)}
.pa-panel__body>.pa-h3{margin-top:var(--space-4);font-size:20px}
.pa-s-ink{stroke:var(--ink);fill:none}.pa-s-white{stroke:var(--surface-raised);fill:none}
.pa-card{position:relative}
.pa-card>svg.pa-card__art{position:absolute;top:var(--space-4);right:var(--space-4);width:72px;height:72px}
.pa-card__art+.pa-tag+.pa-h3{margin-right:80px}
/* RateCard */
.pa-rate__pct{font-size:48px;line-height:52px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.pa-rate__bar{height:8px;border-radius:4px;background:var(--brand-tint);overflow:hidden}
.pa-rate__bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
/* Flow */
.pa-flow{width:100%;max-width:820px;align-self:center;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-10) var(--space-6);background:var(--brand-tint);border-radius:var(--radius-lg)}
.pa-flow__node{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4);background:var(--surface-raised);border-radius:var(--radius-md);text-align:center}
.pa-flow__node svg{width:72px;height:72px}
.pa-flow__node strong{font-size:17px;line-height:26px}
.pa-flow__node span{font-size:13px;line-height:20px;color:var(--ink-muted)}
.pa-flow__node--main{grid-row:1/3}
.pa-arrow{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center;font-size:13px;line-height:20px;font-weight:600;color:var(--ink)}
.pa-arrow::after{content:"";height:14px;background:linear-gradient(var(--ink),var(--ink)) left center/calc(100% - 12px) 4px no-repeat;clip-path:polygon(0 0,calc(100% - 14px) 0,calc(100% - 14px) -50%,100% 50%,calc(100% - 14px) 150%,calc(100% - 14px) 100%,0 100%)}
.pa-arrow::after{background:var(--ink);clip-path:polygon(0 5px,calc(100% - 14px) 5px,calc(100% - 14px) 0,100% 7px,calc(100% - 14px) 14px,calc(100% - 14px) 9px,0 9px)}
.pa-arrow b{display:inline-block;align-self:center;padding:2px 10px;border-radius:var(--radius-sm);background:var(--surface-raised)}
.pa-arrow--hold b{background:var(--accent)}
/* Equation */
.pa-eq{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:var(--space-2)}
.pa-eq__box{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:120px;padding:12px var(--space-4);background:var(--surface);border-radius:var(--radius-md);text-align:center}
.pa-eq__box b{font-size:26px;line-height:34px;font-weight:700;font-variant-numeric:tabular-nums}
.pa-eq__box span{font-size:13px;line-height:20px;color:var(--ink-muted)}
.pa-eq__box--result{background:var(--brand)}
.pa-eq__box--result b,.pa-eq__box--result span{color:var(--on-brand)}
.pa-eq__box--hold{background:var(--accent)}
.pa-eq__box--hold b,.pa-eq__box--hold span{color:var(--ink)}
.pa-eq__op{align-self:center;font-size:26px;font-weight:700;color:var(--ink-muted);padding:0 4px}
/* Split bar and threshold */
.pa-bar{display:flex;height:48px;border-radius:var(--radius-sm);overflow:hidden}
.pa-bar>div{display:grid;place-items:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
.pa-bar__a{background:var(--brand);color:var(--on-brand)}
.pa-bar__b{background:var(--sun);color:var(--ink)}
.pa-bar__off{background:var(--surface-raised);color:var(--ink);border:1px solid var(--ink-muted);border-right:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.pa-legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-6);list-style:none;margin:0;padding:0;font-size:14px;line-height:22px}
.pa-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Path rows and checklist */
.pa-path{display:grid;grid-template-columns:minmax(0,1.4fr) 72px minmax(0,1fr);gap:var(--space-2);align-items:center}
.pa-path__to{padding:12px;border-radius:var(--radius-md);background:var(--brand);color:var(--on-brand);font-size:20px;font-weight:700;text-align:center}
.pa-check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.pa-check li{display:grid;grid-template-columns:28px 1fr auto;gap:var(--space-4);align-items:center;padding:14px var(--space-4);background:var(--surface);border-radius:var(--radius-md)}
.pa-scenario .pa-check li{grid-template-columns:1fr}.pa-scenario .pa-check li::before{display:none}
.pa-check li::before{content:"";width:22px;height:22px;border:2px solid var(--brand);border-radius:6px;box-sizing:border-box}
.pa-check b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pa-scenario{width:100%;max-width:820px;align-self:center;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:var(--space-6);align-items:center;padding:var(--space-6);background:var(--brand-tint);border-radius:var(--radius-lg)}
.pa-scenario svg{width:120px;height:96px}
.pa-scenario p{margin:0}
@media (max-width:760px){.pa-flow{grid-template-columns:minmax(0,1fr);padding:var(--space-4)}.pa-flow__node--main{grid-row:auto}.pa-arrow::after{display:none}.pa-arrow b::after{content:" ↓"}.pa-path{grid-template-columns:minmax(0,1fr)}.pa-scenario{grid-template-columns:minmax(0,1fr)}.pa-check li{grid-template-columns:28px 1fr}.pa-check b{grid-column:2}}
@media (max-width:760px){.pa-grid--2{grid-template-columns:minmax(0,1fr)}}
/* Sample bill */
.pa-bill{width:100%;max-width:460px;align-self:center;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface-raised);border:1px solid var(--ink-muted);border-radius:var(--radius-md);font-size:14px;line-height:22px;color:var(--ink)}
.pa-bill__head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);padding-bottom:var(--space-4);margin-bottom:var(--space-2);border-bottom:2px solid var(--ink)}
.pa-bill__head strong{font-size:16px}
.pa-bill__row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:6px 8px;border-radius:6px}
.pa-bill__row--use{background:var(--sun);font-weight:600}
.pa-bill__row--sum{border-top:1px solid var(--line);border-radius:0;font-weight:700;padding-top:10px}
.pa-bill__note{margin:0;padding:0 8px;font-size:13px;color:var(--ink-muted)}
.pa-panel__body>.pa-card{width:100%;max-width:820px;align-self:center;box-sizing:border-box}
.pa-panel__body>.pa-steps{width:100%;max-width:820px;align-self:center;gap:var(--space-2)}
.pa-panel__body>.pa-steps>li{background:var(--surface);align-items:center}
.pa-steps--art>li{grid-template-columns:40px 1fr 64px}
.pa-steps--art>li>svg{width:64px;height:64px}
@media (max-width:480px){.pa-steps--art>li{grid-template-columns:40px 1fr 44px;padding:var(--space-4)}.pa-steps--art>li>svg{width:44px;height:44px}}
/* Sidebar collapse animation */
.pa-nav__subwrap{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.pa-nav__subwrap.is-open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.pa-nav__subwrap>div{min-height:0;overflow:hidden}
.pa-nav__subwrap .pa-nav__sub{opacity:0;transform:translateY(-6px);transition:opacity .22s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.pa-nav__subwrap.is-open .pa-nav__sub{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.pa-nav__subwrap,.pa-nav__subwrap .pa-nav__sub,.pa-nav__item,.pa-nav__subitem{transition:none}}
.pa-f-surface{fill:var(--surface)}
.pa-card__art+.pa-h3{margin-right:80px}
.pa-grid>.pa-bill{align-self:start;max-width:none}
.pa-bar--wrap{height:auto;min-height:48px}
.pa-bar--wrap>div{white-space:normal;text-align:center;padding:8px 12px;line-height:20px}
/* Sample form */
.pa-form{max-width:440px;gap:6px}
.pa-form .pa-bill__head{justify-content:center;position:relative;border-bottom:0;margin-bottom:0}
.pa-form .pa-bill__head strong{font-size:18px}
.pa-form .pa-bill__head .pa-tag{position:absolute;right:0;top:0}

<h3 class="pa-h3">4. ผู้รับเงินไม่ยอมให้หัก หรือขอให้บริษัทออกภาษีแทน</h3>
<div class="pa-callout pa-callout--caution"><h3 class="pa-callout__title">บริษัทยังมีหน้าที่หักและนำส่ง</h3><p>แม้ผู้รับเงินไม่ยอมให้หัก ถ้าไม่หักไว้ บริษัทต้องรับผิดชอบภาษีส่วนนั้นเอง แจ้งฝ่ายบัญชีก่อนจ่ายเงินทุกครั้ง</p></div>

<div class="pa-grid pa-grid--2">

<div class="pa-card"><svg class="pa-card__art" viewBox="0 0 72 72" aria-hidden="true"><rect class="pa-f-sun" x="8" y="46" width="36" height="11" rx="5.5"/><rect class="pa-f-sun" x="8" y="33" width="36" height="11" rx="5.5"/><rect class="pa-f-sun" x="8" y="20" width="36" height="11" rx="5.5"/><circle class="pa-f-accent" cx="56" cy="24" r="13"/><rect class="pa-f-ink" x="49" y="21.5" width="14" height="5" rx="2.5"/><rect class="pa-f-ink" x="53.5" y="17" width="5" height="14" rx="2.5"/></svg><span class="pa-tag pa-tag--no">บริษัทออกภาษีแทน</span><h3 class="pa-h3">ผู้รับเงินได้ครบ 10,000 บาท</h3><p>บริษัทจ่ายภาษีเพิ่มเอง 309.28 บาท ต้นทุนรวมเป็น 10,309.28 บาท</p></div>

<template id="t2-0"><h2 class="pa-h2">1. ส่งร่างสัญญาให้ฝ่ายกฎหมายตรวจ ผ่านระบบ NBC (Legal Task Request)</h2><ol class="pa-steps pa-steps--art"><li><div><h3 class="pa-h3">จัดเตรียมร่างสัญญา</h3><p>จัดเตรียมร่างสัญญาและเอกสารประกอบให้ครบถ้วน โดยร่างสัญญามีได้ 2 แหล่ง</p><ul style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-muted)"><li>ร่างสัญญามาตรฐานจากฝ่ายกฎหมาย</li><li>ร่างสัญญาที่ผู้รับเหมาหรือ Supplier จัดทำและส่งมาให้บริษัท</li></ul></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-doc"/></svg></li><li><div><h3 class="pa-h3">ตรวจสอบ E-MEMO วิธีพิเศษ</h3><p>ตรวจสอบว่ามี E-MEMO วิธีพิเศษอยู่แล้วหรือไม่ แล้วเลือกทางตามนี้</p><div class="pa-grid pa-grid--2" style="margin-top:12px"><div class="pa-card" style="background:var(--surface-raised)"><span class="pa-tag">มี E-MEMO</span><h3 class="pa-h3">ใช้ E-MEMO เดิม</h3><p>ดำเนินการในขั้นตอนที่ 3 ได้เลย</p></div><div class="pa-card" style="background:var(--surface-raised)"><span class="pa-tag pa-tag--no">ไม่มี E-MEMO</span><h3 class="pa-h3">ทำ E-MEMO ขออนุมัติ</h3><p>สำหรับส่งให้ฝ่ายกฎหมายตรวจ (ผ่าน NBC) โดยผู้อนุมัติตามวงเงินอนุมัติ IPOA</p></div></div></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-check"/></svg></li><li><div><h3 class="pa-h3">ส่งผ่าน NBC</h3><p>ส่งเอกสารและ E-MEMO ที่ได้รับอนุมัติแล้ว ผ่านระบบ NBC</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-nbc"/></svg></li><li><div><h3 class="pa-h3">ฝ่ายกฎหมายตรวจ</h3><p>ฝ่ายกฎหมายรับเรื่องผ่าน NBC และดำเนินการตรวจร่างสัญญา</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-scale"/></svg></li></ol><h2 class="pa-h2">คำศัพท์ที่ควรรู้</h2><div class="pa-grid pa-grid--2"><div class="pa-card"><span class="pa-tag">IPOA</span><h3 class="pa-h3">อำนาจอนุมัติตามตารางอำนาจดำเนินการ</h3><p>Instruments of Power of Attorney ใช้ดูว่าวงเงินนี้ใครเป็นผู้อนุมัติ</p></div><div class="pa-card"><span class="pa-tag">NBC</span><h3 class="pa-h3">ระบบรับเรื่องงานนิติกรรมสัญญา</h3><p>NBC Contract Management System ใช้ส่งเอกสารให้ฝ่ายกฎหมายตรวจ</p></div></div><div class="pa-callout pa-callout--caution"><h3 class="pa-callout__title">ก่อนส่งผ่าน NBC</h3><p>โปรดดำเนินการตามลำดับขั้นตอนและผู้อนุมัติให้ครบถ้วน เพื่อให้การตรวจของฝ่ายกฎหมายเป็นไปอย่างราบรื่น</p></div></template>
<template id="t2-1"><h2 class="pa-h2">2. ส่งร่างบันทึกแก้ไข (แนบท้ายต่างๆ) ให้ฝ่ายกฎหมายตรวจ ผ่านระบบ NBC (Legal Task Request)</h2><div class="pa-callout"><h3 class="pa-callout__title">ต้องมีผู้อนุมัติครบ</h3><p>ต้องทำ E-MEMO อนุมัติสำหรับส่งให้ฝ่ายกฎหมายตรวจ (ผ่าน NBC) ผู้อนุมัติตามวงเงินอนุมัติ IPOA และต้องมีผู้อนุมัติ Project &amp; NBC (VP ขึ้นไป Endorse) และผู้อนุมัติ C-Level ตามสายงาน</p></div><ol class="pa-steps pa-steps--art"><li><div><h3 class="pa-h3">จัดเตรียมร่างบันทึกแก้ไข (แนบท้ายต่างๆ)</h3><p>จัดเตรียมร่างบันทึกแก้ไข (แนบท้ายต่างๆ) และเอกสารประกอบให้ครบถ้วน</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-docedit"/></svg></li><li><div><h3 class="pa-h3">ทำ E-MEMO ขออนุมัติ</h3><p>จัดทำ E-MEMO เพื่อขออนุมัติสำหรับส่งให้ฝ่ายกฎหมายตรวจ (ผ่าน NBC)</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-screen"/></svg></li><li><div><h3 class="pa-h3">ผู้อนุมัติตามวงเงินอนุมัติ IPOA</h3><p>ส่ง E-MEMO ให้ผู้อนุมัติตามวงเงินอนุมัติ IPOA พิจารณาและอนุมัติ</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-coin"/></svg></li><li><div><h3 class="pa-h3">ผู้อนุมัติ Project &amp; NBC (VP ขึ้นไป Endorse)</h3><p>VP ขึ้นไปของสายงาน Project และ NBC พิจารณาและให้ Endorse</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-people"/></svg></li><li><div><h3 class="pa-h3">ผู้อนุมัติ C-Level ตามสายงาน</h3><p>C-Level ตามสายงานพิจารณาและอนุมัติ</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-star"/></svg></li><li><div><h3 class="pa-h3">ส่งผ่าน NBC</h3><p>ส่งเอกสารและ E-MEMO ที่ได้รับอนุมัติครบถ้วนแล้ว ผ่านระบบ NBC</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-nbc"/></svg></li><li><div><h3 class="pa-h3">ฝ่ายกฎหมายตรวจ</h3><p>ฝ่ายกฎหมายรับเรื่องผ่าน NBC และดำเนินการตรวจร่างบันทึกแก้ไข (แนบท้ายต่างๆ)</p></div><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-scale"/></svg></li></ol><h2 class="pa-h2">คำศัพท์ที่ควรรู้</h2><div class="pa-grid pa-grid--2"><div class="pa-card" (function(){
  function days(li,on){
    var root=li.closest('.ck'); if(!root) return;
    ['d','r'].forEach(function(k){
      var v=(li.getAttribute('data-'+k)||'').split('|'); if(v.length<2) return;
      root.querySelectorAll('.ck-card').forEach(function(c){
        var cap=c.querySelector('caption'); if(!cap||cap.textContent.trim()!==v[0]) return;
        c.querySelectorAll('.ck-day').forEach(function(d){ if(d.textContent.trim()===v[1]) d.classList.toggle('ck-glow',on); });
      });
    });
    li.classList.toggle('is-on',on);
  }
  ['mouseover','focusin'].forEach(function(ev){document.addEventListener(ev,function(e){var li=e.target.closest&&e.target.closest('.ck-bul li[data-d]'); if(li) days(li,true);});});
  ['mouseout','focusout'].forEach(function(ev){document.addEventListener(ev,function(e){var li=e.target.closest&&e.target.closest('.ck-bul li[data-d]'); if(li) days(li,false);});});
})();
